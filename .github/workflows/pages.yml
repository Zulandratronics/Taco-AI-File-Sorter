name: Deploy Taco AI File Sorter (GitHub Pages)

on:
  push:
    branches: [main, master]
    paths:
      - "index.html"
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Stage static web app
        run: |
          mkdir -p _site/web
          cp index.html _site/index.html
          cp web/styles.css _site/web/styles.css
          cp web/profiles.js _site/web/profiles.js
          cp web/engine.js _site/web/engine.js
          cp web/app.js _site/web/app.js
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5